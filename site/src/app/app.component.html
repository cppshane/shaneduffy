<div class="site-shell">
  <app-nav></app-nav>
  <app-header></app-header>
  <main id="main-content"><router-outlet></router-outlet></main>
  <app-footer></app-footer>
  <div #pageEnd class="page-end" aria-hidden="true"></div>
  <button class="miku-peek" [class.miku-visible]="mikuVisible" type="button" (click)="toggleMikuCursor()"
    [attr.aria-pressed]="mikuCursorEnabled" [attr.aria-label]="mikuCursorEnabled ? 'Use normal cursor' : 'Use Miku cursor'"
    [title]="mikuCursorEnabled ? 'Use normal cursor' : 'Use Miku cursor'"></button>
</div>
