<div id="videos-container">
  <div #blogSectionContainer id="blog-section-container">
    <app-blog-list-item *ngFor="let blogPost of blogPosts" [blogPost]="blogPost"></app-blog-list-item>
    <p *ngIf="!blogPosts.length" class="feed-status">{{ postsFailed ? 'Could not load the videos.' : 'Loading…' }}</p>
  </div>
  <nav *ngIf="totalPages > 1" class="pagination" aria-label="Video pages">
    <button type="button" *ngFor="let page of [].constructor(totalPages); let i = index"
      (click)="pageClick(i)" [class.current-page]="i === currentPage"
      [attr.aria-current]="i === currentPage ? 'page' : null"
      [attr.aria-label]="'Page ' + (i + 1)">{{ i + 1 }}</button>
  </nav>
</div>
