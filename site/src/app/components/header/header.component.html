<div id="header-container" [class.header-is-home]="homeDisplayStyle === 'flex'">
  <app-particles-background *ngIf="homeDisplayStyle === 'flex'" [paused]="particlesPaused"></app-particles-background>
  <section id="home-header-container" [style.display]="homeDisplayStyle" aria-labelledby="home-title">
    <h1 id="home-title" class="visually-hidden">shaneduffy.io</h1>
  </section>
  <div id="blog-post-header-container" [style.display]="blogPostDisplayStyle">
    <div class="intro-section-content content-section-container"><div id="blog-post-intro-header-container"><div class="keywords-container"><span *ngFor="let keyword of blogPost?.Keywords" class="small-button-container background-purple">{{ keyword }}</span></div><time [dateTime]="blogPost?.Date">{{ blogPost?.Date | date }}</time></div><h1>{{ blogPost?.Title }}</h1></div>
  </div>
  <div id="standard-header-container" [style.display]="standardDisplayStyle"><div class="intro-section-content content-section-container"><h1>{{ standardTitle }}</h1></div></div>
</div>
