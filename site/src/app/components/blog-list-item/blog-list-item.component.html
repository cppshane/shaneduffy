<article class="video-entry">
  <div class="post-media" *ngIf="video || image">
    <button *ngIf="videoPoster && !videoPlaying" class="video-poster" type="button" (click)="videoPlaying = true" [attr.aria-label]="'Play video: ' + blogPost?.Title">
      <img [src]="videoPoster" alt="" loading="lazy"><span aria-hidden="true">▶</span>
    </button>
    <iframe *ngIf="video && (!videoPoster || videoPlaying)" [src]="video | safe:'resourceUrl'" class="video-handler" [title]="blogPost?.Title || 'Video'" loading="lazy" allowfullscreen></iframe>
    <a *ngIf="image" [routerLink]="['/blog/' + blogPost?.Uri]"><img [src]="image | safe:'resourceUrl'" [alt]="blogPost?.Title || ''" loading="lazy"></a>
  </div>
  <div class="post-text">
    <time [dateTime]="blogPost?.Date">{{ blogPost?.Date | date:'yyyy-MM-dd' }}</time>
    <h2><a *ngIf="blogPost?.Uri; else videoTitle" [routerLink]="['/blog/' + blogPost?.Uri]">{{ blogPost?.Title }}</a><ng-template #videoTitle>{{ blogPost?.Title }}</ng-template></h2>
    <p *ngIf="blogPost?.Preview">{{ blogPost?.Preview }}</p>
  </div>
</article>
